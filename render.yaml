services:
  - type: web
    name: paxafe-mock-tive-sender
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: TARGET_URL
        sync: false
      - key: TARGET_API_KEY
        sync: false # Demo-account scoped key only, never the unscoped seed key.
      - key: ALLOW_TARGET_OVERRIDE
        value: "false"
      - key: TARGET_ALLOWLIST
        value: ""
      - key: REQUEST_TIMEOUT_MS
        value: "90000" # A sleeping free-tier API takes about 1 minute to wake.
      - key: TRUST_PROXY
        value: "true"
      - key: SEND_RATE_PER_MINUTE
        value: "10"
      - key: SEND_RATE_PER_MINUTE_GLOBAL
        value: "60"
